<!DOCTYPE html>
<!-- Указываем файл манифеста для кэширования -->
<html lang="ru" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Cache Example (AppCache)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Кэширование через AppCache</h1>
        <p>Эта страница работает даже при выключенном сервере!</p>
        <p>Статус: <span id="status">Проверка...</span></p>
        <button id="check-btn">Проверить соединение</button>
        <div id="log"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
